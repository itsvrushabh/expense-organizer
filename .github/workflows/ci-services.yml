name: CI / Services

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Docker and service health
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start backend and frontend
        run: docker compose up -d --build backend frontend
      - name: Probe frontend and API proxy
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:13000/api/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "${ready}" == true ]]
          curl --fail --silent --show-error http://localhost:13000/
          curl --fail --silent --show-error http://localhost:13000/api/
          curl --fail --silent --show-error http://localhost:13000/api/expenses
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v