name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/expense-organizer

jobs:
  validate-tag:
    name: Validate release tag
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require semantic version tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Allow manual validation run
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual release validation does not publish images or create a GitHub release."

  android:
    name: Android release (${{ matrix.app }})
    needs: validate-tag
    if: needs.validate-tag.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: organizer
            directory: mobile
            artifact: organizer-android
          - app: helper
            directory: expense-helper/mobile
            artifact: helper-android
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build release APK
        working-directory: ${{ matrix.directory }}
        run: |
          if [[ ! -d android ]]; then flutter create --platforms=android .; fi
          flutter pub get
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="0.0.0"
          fi
          flutter build apk --release \
            --build-name "${version_name}" \
            --build-number "${GITHUB_RUN_NUMBER}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}-preview
          path: ${{ matrix.directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS release (${{ matrix.app }})
    needs: validate-tag
    if: needs.validate-tag.result == 'success'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: organizer
            directory: mobile
            artifact: organizer-ios
          - app: helper
            directory: expense-helper/mobile
            artifact: helper-ios
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build unsigned IPA
        working-directory: ${{ matrix.directory }}
        run: |
          flutter pub get
          flutter test
          flutter build ios --release --no-codesign \
            --build-name "${version_name}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          compgen -G "build/ios/iphonesimulator/*.app" >/dev/null
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}-unsigned-preview
          path: ${{ matrix.directory }}/build/ios/iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Publish Docker images
    needs: validate-tag
    if: github.ref_type == 'tag' && needs.validate-tag.result == 'success'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: aibackend
            context: aibackend
          - service: aimodel
            context: aimodel
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.ref_name }}

  github-release:
    name: Attach mobile artifacts to GitHub release
    if: github.ref_type == 'tag'
    needs:
      - validate-tag
      - android
      - ios
      - docker
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true