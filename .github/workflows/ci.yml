name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-python:
    name: Python checks (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            python: "3.13"
            requirements: "requirements.txt requirements-dev.txt"
            tests: backend/tests
          - service: aibackend
            python: "3.11"
            requirements: "requirements.txt"
            tests: tests
          - service: aimodel
            python: "3.11"
            requirements: "requirements.txt"
            tests: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.requirements }}
          python -m pip install ruff==0.9.10
      - name: Check formatting
        run: python -m ruff format --check ${{ matrix.service }} scripts
      - name: Check lint
        run: python -m ruff check ${{ matrix.service }} scripts
      - name: Run tests
        run: python -m pytest ${{ matrix.tests }} -v

  fast-frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check formatting and lint
        working-directory: frontend
        run: bunx --bun @biomejs/biome@1.9.4 check .
      - name: Type check
        working-directory: frontend
        run: bun x tsc --noEmit

  fast-flutter:
    name: Flutter checks (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - mobile
          - expense-helper/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        working-directory: ${{ matrix.app }}
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: ${{ matrix.app }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze
      - name: Test
        working-directory: ${{ matrix.app }}
        run: flutter test

  fast-rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mobile/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('mobile/rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  service-checks:
    name: Lightweight service checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start backend and frontend
        run: docker compose up -d --build backend frontend
      - name: Probe frontend and API proxy
        run: |
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://localhost:13000/api/ >/dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:13000/
          curl --fail --silent --show-error http://localhost:13000/api/
          curl --fail --silent --show-error http://localhost:13000/api/expenses
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

  ci-success:
    name: ci-success
    if: always()
    needs:
      - fast-python
      - fast-frontend
      - fast-flutter
      - fast-rust
      - service-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: ${RESULTS}"
          if [[ "${RESULTS}" == *failure* || "${RESULTS}" == *cancelled* || "${RESULTS}" == *skipped* ]]; then
            exit 1
          fi